<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#F4F4F1;color:#111111;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#F4F4F1">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <!--[if mso]>
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"><tr><td>
        <![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#FFFFFF" style="max-width:560px;border:1px solid #E2E2DC;border-collapse:separate;border-radius:16px;">
          <tr>
            <td bgcolor="#111111" style="padding:18px 20px;border-radius:15px 15px 0 0;color:#FFFFFF;font-size:20px;line-height:26px;font-weight:bold;letter-spacing:1px;">
              СИТИ ПАРК
            </td>
          </tr>
          <tr>
            <td style="padding:24px 20px;">
              <h1 style="margin:0 0 16px;color:#111111;font-size:24px;line-height:30px;">{{.Title}}</h1>
              <dl style="margin:0;">
                {{range .Details}}
                <dt style="margin:0;padding-top:10px;border-top:1px solid #ECECE6;color:#5E5E5A;font-size:14px;line-height:20px;">{{.Label}}</dt>
                <dd style="margin:0;padding:2px 0 10px;color:#111111;font-size:16px;line-height:22px;font-weight:bold;overflow-wrap:anywhere;">{{.Value}}</dd>
                {{end}}
              </dl>
              <p style="margin:14px 0 0;padding:12px 14px;border-radius:8px;background-color:#D6F24A;color:#111111;font-size:16px;line-height:22px;">{{.PaymentNote}}</p>
            </td>
          </tr>
        </table>
        <!--[if mso]>
        </td></tr></table>
        <![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
