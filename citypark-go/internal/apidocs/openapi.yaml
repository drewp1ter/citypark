openapi: 3.0.3
info:
  title: Citypark API
  version: 1.0.0
  description: Backend API of the Citypark restaurant ordering site. Money is in rubles. Timestamps are RFC 3339.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: user
  - name: addresses
  - name: delivery-prices
  - name: catalog
  - name: hotel
  - name: rooms
  - name: news
  - name: content
  - name: settings
  - name: orders
  - name: reports
  - name: integrations
  - name: uploads
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: From 1 to 500. The default is the server's page size.
      schema:
        type: integer
        minimum: 1
        maximum: 500
  responses:
    BadRequest:
      description: Malformed JSON, validation failure or another rejected input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No token or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The token belongs to a user who is not an admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The value is already used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The file is larger than 10 MiB (`Файл больше 10 МБ`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SyncRunning:
      description: Another menu sync is running (`Обновление меню уже выполняется`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: 1C did not answer or returned an error (`Сервис отчётов недоступен`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The order cannot be accepted now (working hours or sale window).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    HotelSalesResponse:
      type: object
      required: [rows, total]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [organization, room, count, sum]
            properties:
              organization: {type: string, example: 'ООО «Олимп»'}
              room: {type: string, example: VIP-номер}
              count: {type: number, example: 3}
              sum: {type: number, description: Rubles., example: 24000}
        total:
          type: object
          required: [count, sum]
          properties:
            count: {type: number, example: 3}
            sum: {type: number, description: Rubles., example: 24000}
    HotelDailyResponse:
      type: object
      required: [days, total]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, sum]
            properties:
              date: {type: string, format: date, example: '2026-10-20'}
              sum: {type: number, description: Rubles., example: 8000}
        total: {type: number, description: Rubles., example: 8000}
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Ошибка валидации, пожалуйста проверьте введенные вами данные
        errors:
          type: object
          description: Present only for validation failures. Keys are JSON paths of the invalid fields.
          additionalProperties:
            type: string
          example:
            phone: телефон должен быть действительным номером телефона
    User:
      type: object
      required: [id, name, email, phone, role]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Иван
        email:
          type: string
          description: Empty string when the user has no email.
          example: ivan@example.com
        phone:
          type: string
          example: '+79991234567'
        role:
          type: string
          enum: [user, admin]
    SignInResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: JWT. Send it as `Authorization Bearer <token>`.
    Address:
      type: object
      required: [id, city, address, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 1
        city:
          type: string
          example: Сочи
        address:
          type: string
          example: ул. Ленина, 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AddressInput:
      type: object
      required: [city, address]
      properties:
        city:
          type: string
          maxLength: 80
          example: Сочи
        address:
          type: string
          maxLength: 1000
          example: ул. Ленина, 1
    DeliveryPrice:
      type: object
      required: [id, name, value, price, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Сочи
        value:
          type: string
          example: Россия, Краснодарский край, Сочи
        price:
          type: number
          description: Rubles.
          example: 150
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeliveryPriceInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          maxLength: 255
          description: Must be unique.
          example: Сочи
        value:
          type: string
          maxLength: 255
          example: Россия, Краснодарский край, Сочи
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Rubles.
          example: 150
    Image:
      type: object
      required: [id, url, type]
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          example: https://example.com/a.jpg
        type:
          type: string
          example: from_iiko
    Category:
      type: object
      required: [id, name, description, images, isAvailableForOrder, salesDays, startTime, endTime]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Мангал
        description:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        isAvailableForOrder:
          type: boolean
          description: Computed for the current moment in the restaurant's time zone.
        salesDays:
          type: string
          description: Empty string when there is no sale window.
          example: Пн, Вт, Ср, Чт, Пт
        startTime:
          type: string
          example: '9:00'
        endTime:
          type: string
          example: '21:00'
    Product:
      type: object
      required:
        - id
        - categoryId
        - name
        - description
        - measureUnit
        - weight
        - proteins
        - fats
        - carbohydrates
        - calories
        - flags
        - price
        - images
        - isAvailableForOrder
        - salesDays
        - startTime
        - endTime
      properties:
        id:
          type: integer
          example: 1
        categoryId:
          type: integer
          example: 1
        name:
          type: string
          example: Шашлык из баранины
        description:
          type: string
        measureUnit:
          type: string
        weight:
          type: number
        proteins:
          type: number
        fats:
          type: number
        carbohydrates:
          type: number
        calories:
          type: number
        flags:
          type: integer
        price:
          type: number
          description: Rubles.
          example: 320
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        isAvailableForOrder:
          type: boolean
          description: True only when both the product's own window and its category's window are open now.
        salesDays:
          type: string
          description: The product's own sale window. Empty string when it has none.
        startTime:
          type: string
        endTime:
          type: string
    OrderItemInput:
      type: object
      required: [productId, amount]
      properties:
        productId:
          type: integer
          minimum: 1
          example: 1
        amount:
          type: integer
          minimum: 1
          example: 2
    CreateOrder:
      type: object
      required: [phone, name, paymentType, items]
      properties:
        phone:
          type: string
          description: A valid Russian phone number. It is stored as +7XXXXXXXXXX.
          example: '+79991234567'
        name:
          type: string
          maxLength: 80
          example: Иван
        comment:
          type: string
          maxLength: 8192
          example: Без лука
        paymentType:
          type: string
          enum: [cash, online]
        address:
          allOf:
            - $ref: '#/components/schemas/AddressInput'
          description: Delivery address. Leave it out for pickup. `city` must be the name of a delivery price.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
    CreateOrderResult:
      type: object
      description: For a cash order `redirectUrl` is set. For an online order `amount` and `mntSignature` are set.
      required: [orderId]
      properties:
        orderId:
          type: integer
          example: 1
        redirectUrl:
          type: string
          example: http://localhost:3001/thankyou
        amount:
          type: string
          description: Value of MNT_AMOUNT for the Moneta payment form.
          example: '790.00'
        mntSignature:
          type: string
          description: Value of MNT_SIGNATURE for the Moneta payment form.
          example: 8c65fcd4afe3dc4cb915e04aaa273574
    Order:
      type: object
      required: [id, createdAt, updatedAt, status, comment, paymentType, total, deliveryPrice, customer, address, items]
      properties:
        id:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [new, paid, confirmed, canceled]
        comment:
          type: string
        paymentType:
          type: string
          enum: [cash, online]
        total:
          type: number
          description: Sum of the items without delivery, in rubles.
          example: 599
        deliveryPrice:
          type: number
          example: 150
        customer:
          type: object
          required: [id, name, phone]
          properties:
            id:
              type: integer
            name:
              type: string
            phone:
              type: string
        address:
          type: object
          nullable: true
          description: Null for a pickup order.
          required: [id, city, address]
          properties:
            id:
              type: integer
            city:
              type: string
            address:
              type: string
        items:
          type: array
          items:
            type: object
            required: [productId, name, categoryName, amount, offeredPrice]
            properties:
              productId:
                type: integer
              name:
                type: string
              categoryName:
                type: string
              amount:
                type: integer
              offeredPrice:
                type: number
                description: Rubles. The price the item was ordered at.
    OrderList:
      type: object
      required: [orders, count]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        count:
          type: integer
          description: Total number of orders, not the size of the page.
    SyncResult:
      type: object
      required: [totalCategories, totalProducts]
      properties:
        totalCategories:
          type: integer
          example: 2
        totalProducts:
          type: integer
          example: 27
    HotelRooms:
      type: object
      required: [vip, singleBalcony, single, doubleTwin, doubleEuro]
      properties:
        vip:
          type: integer
          minimum: 0
          maximum: 1
          description: Room 301.
        singleBalcony:
          type: integer
          minimum: 0
          maximum: 1
          description: Room 201.
        single:
          type: integer
          minimum: 0
          maximum: 2
          description: Rooms 204 and 304.
        doubleTwin:
          type: integer
          minimum: 0
          maximum: 4
          description: Rooms 203, 206, 302 and 303.
        doubleEuro:
          type: integer
          minimum: 0
          maximum: 4
          description: Rooms 202, 205, 305 and 306.
    HotelState:
      type: object
      required: [rooms, free, updatedAt]
      properties:
        rooms:
          $ref: '#/components/schemas/HotelRooms'
        free:
          type: integer
          description: Total number of free rooms, the sum of the five counts.
          example: 4
        updatedAt:
          type: string
          format: date-time
    HotelRoomsRequest:
      type: object
      required: [rooms]
      properties:
        rooms:
          $ref: '#/components/schemas/HotelRooms'
    BreakfastItem:
      type: object
      required: [name, shortName, price, desktopOnly]
      properties:
        name:
          type: string
          example: Омлет, 130 г
        shortName:
          type: string
          example: Омлет
        price:
          type: number
          description: Rubles.
          example: 250
        desktopOnly:
          type: boolean
          description: The item is hidden on the mobile version of the site.
    HotelPrices:
      type: object
      required: [breakfastDelivery, lateCheckoutPerHour, smokingFine, breakfast, updatedAt]
      properties:
        breakfastDelivery:
          type: number
          description: Rubles. Fills `{{breakfastDelivery}}` in the content blocks.
          example: 100
        lateCheckoutPerHour:
          type: number
          description: Rubles. Fills `{{lateCheckoutPerHour}}`.
          example: 500
        smokingFine:
          type: number
          description: Rubles. Fills `{{smokingFine}}`.
          example: 2000
        breakfast:
          type: array
          items:
            $ref: '#/components/schemas/BreakfastItem'
        updatedAt:
          type: string
          format: date-time
    BreakfastItemInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          maxLength: 80
        shortName:
          type: string
          maxLength: 40
        price:
          type: number
          minimum: 0
          maximum: 100000
          description: Rubles, at most 2 decimals.
        desktopOnly:
          type: boolean
          default: false
    HotelPricesInput:
      type: object
      required: [breakfastDelivery, lateCheckoutPerHour, smokingFine]
      properties:
        breakfastDelivery:
          type: number
          minimum: 0
          maximum: 100000
          description: Rubles, at most 2 decimals.
        lateCheckoutPerHour:
          type: number
          minimum: 0
          maximum: 100000
          description: Rubles, at most 2 decimals.
        smokingFine:
          type: number
          minimum: 0
          maximum: 100000
          description: Rubles, at most 2 decimals.
        breakfast:
          type: array
          maxItems: 30
          description: The whole menu in display order. A missing field means an empty menu.
          items:
            $ref: '#/components/schemas/BreakfastItemInput'
    RoomPhoto:
      type: object
      required: [url, alt, position]
      properties:
        url:
          type: string
          description: A site path (`/images/...`) or the full URL of an uploaded image.
          example: /images/room-vip.jpg
        alt:
          type: string
          example: VIP-номер
        position:
          type: string
          description: Empty, or a CSS object-position of the form `50% 30%`.
          example: ''
    Room:
      type: object
      required: [id, kind, balcony, name, hotelName, numbers, area, areaDetailed, capacity, description, pricePerNight, photo, hotelNote, updatedAt]
      properties:
        id:
          type: string
          enum: [vip, single-balcony, single, double-twin, double-euro]
        kind:
          type: string
          enum: [single, double, vip]
        balcony:
          type: boolean
        name:
          type: string
          example: VIP-номер
        hotelName:
          type: string
          example: VIP, 2 комнаты
        numbers:
          type: string
          example: '№ 301'
        area:
          type: string
          example: 45 + 7 м²
        areaDetailed:
          type: string
          example: 45 м² + балкон 7 м²
        capacity:
          type: string
          example: до 4 гостей
        description:
          type: string
          description: HTML with p, br, strong, em, a, ul, ol and li only.
          example: <p>Гостиная и спальня, балкон над кронами парка.</p>
        pricePerNight:
          type: number
          description: Rubles per night.
          example: 8000
        photo:
          $ref: '#/components/schemas/RoomPhoto'
        hotelNote:
          type: string
          example: '№ 301 · до 4 гостей'
        updatedAt:
          type: string
          format: date-time
    RoomInput:
      type: object
      required: [name, numbers, area, pricePerNight, photo]
      properties:
        name:
          type: string
          maxLength: 100
        hotelName:
          type: string
          maxLength: 100
        numbers:
          type: string
          maxLength: 100
        area:
          type: string
          maxLength: 100
        areaDetailed:
          type: string
          maxLength: 100
        capacity:
          type: string
          maxLength: 100
        description:
          type: string
          description: HTML, cleaned on save. At most 1000 characters of visible text.
        pricePerNight:
          type: number
          description: Rubles per night, greater than 0, at most 1000000, at most 2 decimals.
          example: 5200
        photo:
          type: object
          required: [url]
          properties:
            url:
              type: string
              description: A site path (`/images/...`) or an uploaded image (`/uploads/...` or its full URL).
            alt:
              type: string
              maxLength: 200
            position:
              type: string
              description: Empty, or `X% Y%` with X and Y from 0 to 100.
              example: 50% 30%
        hotelNote:
          type: string
          maxLength: 100
    ContentImage:
      type: object
      required: [url, alt, position]
      properties:
        url:
          type: string
          example: /images/hotel-building.jpg
        alt:
          type: string
          maxLength: 200
        position:
          type: string
          description: Empty, or `X% Y%` with X and Y from 0 to 100.
          example: 50% 30%
    SettingsPhone:
      type: object
      required: [label, shortLabel, display, number, altDisplay, altNumber]
      properties:
        label: {type: string, maxLength: 60, example: Ресторан и доставка}
        shortLabel: {type: string, maxLength: 30, example: Ресторан}
        display: {type: string, maxLength: 40, example: 8 918 311-97-91}
        number: {type: string, maxLength: 20, example: '+79183119791'}
        altDisplay: {type: string, maxLength: 40, example: 8 (86155) 3-30-03}
        altNumber: {type: string, maxLength: 20, example: '+78615533003'}
    SettingsSocial:
      type: object
      required: [name, label, url, display]
      properties:
        name: {type: string, maxLength: 40, example: ВКонтакте}
        label: {type: string, maxLength: 10, example: VK}
        url: {type: string, maxLength: 200, description: Starts with `https://`., example: 'https://vk.com/cityparkvip'}
        display: {type: string, maxLength: 60, example: vk.com/cityparkvip}
    Settings:
      type: object
      required: [phones, address, email, company, social]
      properties:
        phones:
          type: object
          required: [restaurant, hotel, free, landline]
          properties:
            restaurant: {$ref: '#/components/schemas/SettingsPhone'}
            hotel: {$ref: '#/components/schemas/SettingsPhone'}
            free: {$ref: '#/components/schemas/SettingsPhone'}
            landline: {$ref: '#/components/schemas/SettingsPhone'}
        address:
          type: object
          required: [postcode, city, street]
          properties:
            postcode: {type: string, description: Six digits., example: '352630'}
            city: {type: string, maxLength: 60, example: Белореченск}
            street: {type: string, maxLength: 100, example: 'ул. Гоголя, 61'}
        email: {type: string, maxLength: 100, example: belcitypark@mail.ru}
        company:
          type: object
          required: [name, inn, ogrn]
          properties:
            name: {type: string, maxLength: 100, example: ООО «Олимп»}
            inn: {type: string, description: 10 to 12 digits., example: '2309117400'}
            ogrn: {type: string, description: 13 to 15 digits., example: '1092309002378'}
        social:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/SettingsSocial'}
    SettingsResponse:
      allOf:
        - $ref: '#/components/schemas/Settings'
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: {type: string, format: date-time}
    ContentBlock:
      type: object
      required: [key, page, section, label, type, maxLength, value, image, updatedAt]
      properties:
        key:
          type: string
          example: home.hero.title
        page:
          type: string
          example: home
        section:
          type: string
          example: Первый экран
        label:
          type: string
          example: Заголовок
        type:
          type: string
          enum: [text, lines, richtext, image]
        maxLength:
          type: integer
          description: The effective character limit; 0 for `lines` and `image`.
          example: 300
        value:
          nullable: true
          description: >-
            A string for `text` and `richtext` (HTML), an array of strings for `lines`, `null` for `image`.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        image:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ContentImage'
          description: Set only for `image` blocks.
        updatedAt:
          type: string
          format: date-time
    ContentBlockInput:
      type: object
      properties:
        value:
          description: For `text` and `richtext` a string, for `lines` an array of strings.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        image:
          type: object
          description: For `image` blocks.
          required: [url]
          properties:
            url:
              type: string
              description: A site path (`/images/...`) or an uploaded image (`/uploads/...` or its full URL).
            alt:
              type: string
              maxLength: 200
            position:
              type: string
              example: 50% 30%
    NewsPhoto:
      type: object
      required: [url, alt, position]
      properties:
        url:
          type: string
          description: Empty (no photo), a site path (`/images/...`) or the full URL of an uploaded image.
          example: /images/news-menu.jpg
        alt:
          type: string
        position:
          type: string
          description: Empty, or a CSS object-position of the form `50% 30%`.
    NewsSummary:
      type: object
      required: [id, slug, date, title, shortTitle, excerpt, photo, updatedAt]
      properties:
        id:
          type: integer
          example: 4
        slug:
          type: string
          example: new-menu-2026
        date:
          type: string
          format: date
          example: '2026-03-16'
        title:
          type: string
          example: Новое меню в Сити Парке 2026
        shortTitle:
          type: string
          example: Новое меню 2026
        excerpt:
          type: string
        photo:
          $ref: '#/components/schemas/NewsPhoto'
        updatedAt:
          type: string
          format: date-time
    NewsItem:
      allOf:
        - $ref: '#/components/schemas/NewsSummary'
        - type: object
          required: [body]
          properties:
            body:
              type: string
              description: HTML with p, h2, h3, strong, em, a, ul, ol, li, blockquote and br only.
              example: <p>Текст новости</p>
    NewsList:
      type: object
      required: [news, count]
      properties:
        news:
          type: array
          items:
            $ref: '#/components/schemas/NewsSummary'
        count:
          type: integer
          description: The number of all items, not of this page.
          example: 7
    NewsInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Empty makes it from the title (`-2`, `-3`, ... when taken).
        date:
          type: string
          format: date
          description: Empty is today.
          example: '2026-10-20'
        shortTitle:
          type: string
          maxLength: 100
        excerpt:
          type: string
          maxLength: 300
        body:
          type: string
          description: HTML, cleaned on save. At most 50000 characters of visible text.
        photo:
          type: object
          properties:
            url:
              type: string
              description: Empty (no photo), a site path (`/images/...`) or an uploaded image (`/uploads/...` or its full URL).
            alt:
              type: string
              maxLength: 200
            position:
              type: string
              description: Empty, or `X% Y%` with X and Y from 0 to 100.
              example: 50% 30%
paths:
  /health:
    get:
      summary: Check that the server is up
      description: 'Role: public.'
      tags: [integrations]
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /auth/sign-up:
    post:
      summary: Register a new customer account
      description: >-
        Role: public. The answer is always 201 with an empty object, also when the email or phone
        is already registered. No token is returned: call sign-in afterwards.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, password]
              properties:
                name:
                  type: string
                  maxLength: 80
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  description: A Russian phone number in any common format.
                password:
                  type: string
                  minLength: 8
                  maxLength: 64
            example:
              name: Иван
              email: ivan@example.com
              phone: 8 (999) 123-45-67
              password: secret-pass
      responses:
        '201':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/sign-in:
    post:
      summary: Sign in and get a token
      description: 'Role: public. An unknown email and a wrong password give the same 401.'
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
            example:
              email: ivan@example.com
              password: secret-pass
      responses:
        '200':
          description: The user and a token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user:
    get:
      summary: Get the signed-in user's profile
      description: 'Role: user.'
      tags: [user]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Update the signed-in user's profile
      description: >-
        Role: user. The request replaces the profile: omitting `email` removes the stored email,
        omitting `phone` keeps the current one.
      tags: [user]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 80
                email:
                  type: string
                  format: email
                phone:
                  type: string
            example:
              name: Новое имя
              email: New@Example.com
              phone: 8 999 000 00 02
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /addresses:
    get:
      summary: List the signed-in user's delivery addresses
      description: 'Role: user. Ordered by id.'
      tags: [addresses]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The addresses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Add a delivery address
      description: >-
        Role: user. Posting the same address twice returns the same id. Addresses are shared
        between users.
      tags: [addresses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: The address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /addresses/{id}:
    delete:
      summary: Remove an address from the user's list
      description: >-
        Role: user. The answer is 204 also when the address does not exist. Only the user's link
        is removed.
      tags: [addresses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /delivery-prices:
    get:
      summary: List the delivery price of every town
      description: 'Role: public. Ordered by id.'
      tags: [delivery-prices]
      responses:
        '200':
          description: The delivery prices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryPrice'
    post:
      summary: Create delivery prices
      description: 'Role: admin. All items are created or none.'
      tags: [delivery-prices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryPrices]
              properties:
                deliveryPrices:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/DeliveryPriceInput'
            example:
              deliveryPrices:
                - name: Сочи
                  value: Россия, Краснодарский край, Сочи
                  price: 150
                - name: Адлер
                  price: 99.5
      responses:
        '201':
          description: The created delivery prices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryPrice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /delivery-prices/{id}:
    patch:
      summary: Replace the name, description and price of a delivery price
      description: 'Role: admin. A full replacement: an omitted `value` becomes an empty string.'
      tags: [delivery-prices]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryPriceInput'
      responses:
        '200':
          description: The updated delivery price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPrice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete a delivery price
      description: 'Role: admin. The answer is 204 also when the delivery price does not exist.'
      tags: [delivery-prices]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories:
    get:
      summary: List the categories
      description: 'Role: public. Deleted categories are left out. Ordered by sort order, then id.'
      tags: [catalog]
      responses:
        '200':
          description: The categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /categories/{id}:
    get:
      summary: Get one category
      description: 'Role: public.'
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories/{id}/products:
    get:
      summary: List the products of one category
      description: >-
        Role: public. Ordered by sort order, then id. Deleted products are left out. An unknown
        category gives 200 with an empty list.
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      summary: Search products across all categories
      description: >-
        Role: public. A product matches when any word of `query` matches its name, its category
        name or one of its tags. Without `query` every product is returned.
      tags: [catalog]
      parameters:
        - name: query
          in: query
          required: false
          description: Words separated by spaces. Only the first 20 words are used.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
  /hotel/rooms:
    get:
      summary: Get the free hotel rooms
      description: >-
        Role: public. The answer is 404 while the hotel's sender has not posted the counts yet; the
        site hides the counter then.
      tags: [hotel]
      responses:
        '200':
          description: The free rooms of each type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelState'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Replace the free hotel rooms
      description: >-
        Role: public, protected by a shared secret in the `X-Webhook-Secret` header. Meant for the
        hotel's external sender, not for the site frontend. All five counts are required every time.
        The endpoint answers 404 when the server has no secret configured.
      tags: [hotel]
      parameters:
        - name: X-Webhook-Secret
          in: header
          required: true
          description: Must equal the server's HOTEL_WEBHOOK_SECRET.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelRoomsRequest'
      responses:
        '200':
          description: The counts are stored. The body is the same as for GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /hotel/prices:
    get:
      summary: Get the hotel fees and the breakfast menu
      description: >-
        Role: public. These numbers fill the placeholders `{{breakfastDelivery}}`, `{{lateCheckoutPerHour}}`
        and `{{smokingFine}}` of the content blocks.
      tags: [hotel]
      responses:
        '200':
          description: The fees and the breakfast items in display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelPrices'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace the hotel fees and the breakfast menu
      description: >-
        Role: admin. A full replacement in one transaction: the three fees and the whole breakfast list. The
        items are stored in the order sent. On an error nothing changes.
      tags: [hotel]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelPricesInput'
      responses:
        '200':
          description: The stored state, the same as for GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelPrices'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /rooms:
    get:
      summary: Get the five hotel room types
      description: >-
        Role: public. Ordered as on the site. The room ids are fixed, the same as in `/hotel/rooms`.
        An uploaded photo comes back as a full URL.
      tags: [rooms]
      responses:
        '200':
          description: The rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
  /rooms/{id}:
    put:
      summary: Replace the editable fields of a room type
      description: >-
        Role: admin. A full replacement: an omitted optional field becomes an empty string. The room price is
        edited only here. When `photo.url` changes, the replaced uploaded file is deleted.
      tags: [rooms]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum: [vip, single-balcony, single, double-twin, double-euro]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '200':
          description: The stored room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /news:
    get:
      summary: List news
      description: >-
        Role: public. Newest first (`date` descending, then `id` descending). The items have no `body`.
      tags: [news]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of news and the total count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsList'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Create a news item
      description: >-
        Role: admin. Live at once. An empty `slug` is made from the title; a generated slug that is taken gets
        `-2`, `-3`, ...; a slug typed by the admin that is taken gives 409.
      tags: [news]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsInput'
      responses:
        '201':
          description: The stored item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /news/{slug}:
    get:
      summary: Get one news item with its body
      description: 'Role: public.'
      tags: [news]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItem'
        '404':
          $ref: '#/components/responses/NotFound'
  /news/{id}:
    put:
      summary: Replace all fields of a news item
      description: >-
        Role: admin. A full replacement: an omitted optional field becomes an empty string. The item's own slug is
        not a conflict. When `photo.url` changes, the replaced uploaded file is deleted.
      tags: [news]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsInput'
      responses:
        '200':
          description: The stored item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete a news item
      description: 'Role: admin. The uploaded photo file of the item is deleted too.'
      tags: [news]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /content/blocks:
    get:
      summary: List content blocks
      description: >-
        Role: public. Ordered by page, sort and key. `?page=home` keeps one page; an unknown page gives `[]`. Replace
        the price placeholders (`{{smokingFine}}`, ...) in `text`, `lines` and `richtext` values before showing them.
      tags: [content]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
          example: home
      responses:
        '200':
          description: The blocks (not paged).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentBlock'
  /content/blocks/{key}:
    put:
      summary: Set the value of a content block
      description: >-
        Role: admin. Keys are created by migrations; there is no endpoint to add or delete one. Send `value` for
        `text`, `lines` and `richtext` blocks, `image` for `image` blocks. A value of the wrong JSON type gives 400
        `неверный тип значения`. When an `image` block gets a different photo, the replaced uploaded file is deleted.
      tags: [content]
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          example: home.hero.title
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBlockInput'
      responses:
        '200':
          description: The block with the stored value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentBlock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /settings:
    get:
      summary: Get the site settings
      description: >-
        Role: public. Phones, address, e-mail, company details and social links. The site builds `tel:` links
        from `number`.
      tags: [settings]
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace the site settings
      description: >-
        Role: admin. Replaces the whole object: send what GET returned with your changes. Strings are trimmed.
        `number` and `altNumber` are `+` and 10 to 15 digits (`номер: только цифры и «+»`); `altDisplay` and
        `altNumber` are set together (`заполните оба поля`); `social[i].url` starts with `https://`
        (`ссылка должна начинаться с https://`). An `updatedAt` in the body is ignored.
      tags: [settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders:
    post:
      summary: Place an order
      description: >-
        Role: public. The customer is found by phone number or created. Orders are accepted only
        during working hours. For a cash order send the customer to `redirectUrl`. For an online
        order open the Moneta payment form with `orderId`, `amount` and `mntSignature`.
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              phone: '+79991234567'
              name: Иван
              comment: Без лука
              paymentType: cash
              address:
                city: Сочи
                address: ул. Ленина, 1
              items:
                - productId: 1
                  amount: 2
      responses:
        '201':
          description: The order is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      summary: List all orders
      description: >-
        Role: admin. Newest first. All filters are optional and combine with AND; an empty
        parameter is the same as a missing one. `count` is the number of matching orders.
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          required: false
          description: >-
            Free text, at most 100 characters after trimming. Digits only: matches the order number
            or any part of the customer's phone. Otherwise: matches the customer's name
            (case-insensitive) or any part of the phone.
          schema:
            type: string
            maxLength: 100
        - name: from
          in: query
          required: false
          description: First day, inclusive, in the restaurant's time zone (`APP_TIMEZONE`).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last day, inclusive, in the restaurant's time zone. Not before `from`.
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, pending, paid, canceled, confirmed]
        - name: paymentType
          in: query
          required: false
          schema:
            type: string
            enum: [cash, online]
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orders/my:
    get:
      summary: List the signed-in user's orders
      description: 'Role: user. Newest first.'
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{id}:
    get:
      summary: Get one order
      description: >-
        Role: user. An admin can read any order. For a normal user someone else's order looks the
        same as a missing one.
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete an order together with its items
      description: >-
        Role: admin. The answer is 204 also when the order does not exist. The customer and the
        address are not deleted.
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/items:
    post:
      summary: Add a product to an order or change its amount
      description: >-
        Role: admin. A new item is stored with the product's current price. For a product that is
        already in the order only the amount is replaced. Sale windows are not checked.
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemInput'
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/items/{productId}:
    delete:
      summary: Remove one product from an order
      description: >-
        Role: admin. The answer is 204 also when the order or the item does not exist. The order
        stays even when its last item is removed.
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/confirm:
    post:
      summary: Confirm an order and notify the staff
      description: >-
        Role: admin. The status is set whatever it was before, and every call notifies the staff
        again.
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The updated order with status `confirmed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/hotel/sales:
    get:
      summary: Hotel revenue by room
      description: >-
        Role: admin. Revenue by organization and room, sorted by organization, then room. Data comes from 1C (the hotel database). `from` and `to` are local dates
        (`APP_TIMEZONE`, both inclusive) in `YYYY-MM-DD`; `to` is not before `from`; the period is at most 366 days.
        400 `Некорректные параметры отчёта` has `errors.from` / `errors.to` (`дата в формате ГГГГ-ММ-ДД`,
        `не раньше даты from`, `период не больше 366 дней`). 404 when 1C is not configured. 502
        `Сервис отчётов недоступен` when 1C did not answer within 30 s or returned an error.
      tags: [reports]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelSalesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /reports/hotel/daily:
    get:
      summary: Hotel revenue per day
      description: >-
        Role: admin. One entry for every day of the period; `0` for days without revenue. Data comes from 1C (the hotel database). `from` and `to` are local dates
        (`APP_TIMEZONE`, both inclusive) in `YYYY-MM-DD`; `to` is not before `from`; the period is at most 366 days.
        400 `Некорректные параметры отчёта` has `errors.from` / `errors.to` (`дата в формате ГГГГ-ММ-ДД`,
        `не раньше даты from`, `период не больше 366 дней`). 404 when 1C is not configured. 502
        `Сервис отчётов недоступен` when 1C did not answer within 30 s or returned an error.
      tags: [reports]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelDailyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /iiko/update-products:
    post:
      summary: Download the menu from iiko and apply it
      description: >-
        Role: public, protected by a shared secret in the `X-Update-Token` header. Meant for a
        scheduler or an admin tool, not for the site frontend. The endpoint answers 404 when the
        server has no token configured.
      tags: [integrations]
      parameters:
        - name: X-Update-Token
          in: header
          required: true
          description: Must equal the server's IIKO_UPDATE_TOKEN.
          schema:
            type: string
      responses:
        '200':
          description: The update is applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SyncRunning'
  /iiko/sync:
    post:
      summary: Start the menu sync from iiko (admin)
      description: >-
        Role: admin. The same sync as `/iiko/update-products`, for the admin panel button. Takes a
        few seconds. Only one sync runs at a time, so it answers 409 while another one runs, also
        one started by the timer or by `/iiko/update-products`.
      tags: [integrations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The sync is applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/SyncRunning'
  /webhooks/moneta:
    post:
      summary: Moneta payment notification
      description: >-
        Role: public, trusted only when `MNT_SIGNATURE` is correct. Called by Moneta, not by the
        site frontend. The body is form data and the answer is plain text `SUCCESS` or `FAIL`.
      tags: [integrations]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [MNT_TRANSACTION_ID, MNT_OPERATION_ID, MNT_AMOUNT, MNT_SIGNATURE]
              properties:
                MNT_TRANSACTION_ID:
                  type: string
                  description: Our order id.
                MNT_OPERATION_ID:
                  type: string
                  description: Moneta's id of the payment.
                MNT_AMOUNT:
                  type: string
                  description: Rubles with two decimals. Must equal the order total plus delivery.
                MNT_SIGNATURE:
                  type: string
      responses:
        '200':
          description: The payment is accepted, or was already accepted.
          content:
            text/plain:
              schema:
                type: string
                example: SUCCESS
        '400':
          description: The order id or the amount is wrong. The body is `FAIL`.
          content:
            text/plain:
              schema:
                type: string
                example: FAIL
        '403':
          description: The signature is wrong. The body is `FAIL`.
          content:
            text/plain:
              schema:
                type: string
                example: FAIL
        '404':
          description: The order does not exist. The body is `FAIL`.
          content:
            text/plain:
              schema:
                type: string
                example: FAIL
  /uploads:
    post:
      summary: Upload an image (admin)
      description: >-
        Role: admin. Send a JPEG, PNG or WebP image of at most 10 MiB as the multipart field `file`.
        The type is detected from the content; the file name and part Content-Type are ignored. The
        returned `url` is what content endpoints accept as a photo URL. Files that are never used are
        not cleaned up. Uploaded files are served as static files at `GET /uploads/...`, outside
        `/api/v1`.
      tags: [uploads]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The image is stored.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    example: http://localhost:3000/uploads/2026/10/c19b550d7d3fc582866bd4e85f9301b7.png
        '400':
          description: No `file` field (`Выберите файл`) or not a JPEG, PNG or WebP image (`Допустимы только JPEG, PNG и WebP`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
