<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет соединения — Сити Парк</title>
<style>
	:root {
		color-scheme: light dark;
		--bg: #f4f4f1; /* --bg (light) */
		--surface: #ffffff; /* --surface (light) */
		--border: #e2e2dc; /* --border (light) */
		--text: #111111; /* --text (light) */
		--text-muted: #5e5e5a; /* --text-muted (light) */
		--accent: #d6f24a; /* --accent */
		--on-accent: #111111; /* --on-accent (light) */
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0b0b0c; /* --bg (dark) */
			--surface: #161618; /* --surface (dark) */
			--border: #26262a; /* --border (dark) */
			--text: #f2f2ee; /* --text (dark) */
			--text-muted: #a3a39c; /* --text-muted (dark) */
			--on-accent: #0f0f10; /* --on-accent (dark) */
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 16px;
		background: var(--bg);
		color: var(--text);
		font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
		line-height: 1.5;
	}
	main {
		width: 100%;
		max-width: 420px;
		padding: 32px 24px;
		text-align: center;
		background: var(--surface);
		border: 1px solid var(--border);
		border-radius: 24px;
	}
	h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.2; }
	p { margin: 0 0 20px; color: var(--text-muted); }
	p:last-child { margin-bottom: 0; }
	a { color: var(--text); font-weight: 600; }
	button {
		min-height: 44px;
		padding: 0 28px;
		margin-bottom: 20px;
		border: 0;
		border-radius: 999px;
		background: var(--accent);
		color: var(--on-accent);
		font: inherit;
		font-weight: 600;
		cursor: pointer;
	}
	button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
	<h1>Нет соединения с интернетом</h1>
	<p>Проверьте подключение и обновите страницу.</p>
	<button type="button" onclick="location.reload()">Обновить</button>
	<p>Заказать по телефону: <a href="tel:+79183119791">8&nbsp;918&nbsp;311-97-91</a></p>
</main>
</body>
</html>
